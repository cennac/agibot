# AGIBOT MB0002 V2 - RK3588 robot board (based on rock-5b)
BOARD_NAME="AGIBOT MB0002"
BOARD_VENDOR="agibot"
BOARDFAMILY="rockchip-rk3588"
BOARD_MAINTAINER="user"
INTRODUCED="2024"
# Board-specific U-Boot files are installed by the board_agibot user patch.
# Do not fall back to rock-5b: its vendor defconfig disables the console and
# embeds the wrong early-boot DTB for this carrier.
BOOTCONFIG="agibot-rk3588_defconfig"
KERNEL_TARGET="vendor"
KERNEL_TEST_TARGET="vendor"
FULL_DESKTOP="no"
BOOT_LOGO="no"
# Keep both the UART recovery console and the HDMI framebuffer console.
# The vendor U-Boot still takes the effective console list from DTB /chosen.
DEFAULT_CONSOLE="both"
BOOT_FDT_FILE="rockchip/rk3588-agibot-mb0002-v2.dtb"
BOOT_SCENARIO="spl-blobs"
BOOT_SUPPORT_SPI="no"
IMAGE_PARTITION_TABLE="gpt"
